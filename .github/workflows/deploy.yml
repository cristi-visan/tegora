name: Deploy to staging

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push replaces a running deploy. A cancelled extraction is safe:
# the next run unpacks the full release again.
concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  SITE_URL: https://tegora-staging.codefor.ge

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: codefor.ge ENV
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl, openssl, mbstring, zip, gd, simplexml
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader --no-scripts

      - name: Check PHP syntax of our own code
        run: find plugins/tegora _deploy -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check deploy secrets
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::DEPLOY_TOKEN secret is not set."
            exit 1
          fi

      # One archive instead of ~13,000 single FTP uploads. Tracked files plus
      # vendor/, minus anything that must not reach the server.
      - name: Build release archive
        run: |
          { git ls-files; find vendor -type f; } \
            | grep -vE '^(\.github/|\.devcontainer/|tests/|_deploy/|\.env($|\.)|README\.md$|CHANGELOG\.md$|CONTRIBUTING\.md$)' \
            | sort -u > .release-manifest
          echo ".release-manifest" >> .release-manifest
          zip -q -X release.zip -@ < .release-manifest
          echo "Files: $(wc -l < .release-manifest), archive: $(du -h release.zip | cut -f1)"

      # FTPS with certificate checks relaxed (-k), because shared hosts often
      # present a certificate for the server's own name. See decision D-012.
      - name: Upload archive and extractor
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          dir="${FTP_DIR%/}"
          # curl reads a URL path as relative to the FTP login folder; %2F marks an absolute one
          case "$dir" in
            /*) root="ftp://${FTP_SERVER}/%2F${dir#/}" ;;
            *)  root="ftp://${FTP_SERVER}/${dir}" ;;
          esac
          upload() {
            curl --fail --silent --show-error --ssl-reqd -k --ftp-create-dirs \
              --retry 3 --max-time 900 \
              --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
              -T "$1" "$2"
            echo "Uploaded $1"
          }
          # .htaccess first: an older copy on the server would block the extractor
          upload .htaccess "${root}/.htaccess"
          upload _deploy/extract.php "${root}/_deploy/extract.php"
          upload release.zip "${root}/_deploy/release.zip"

      - name: Unpack on the server
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          next=0
          for i in $(seq 1 200); do
            out=$(curl --fail-with-body --silent --show-error --max-time 120 -X POST \
              -H "X-Deploy-Token: $DEPLOY_TOKEN" \
              "$SITE_URL/_deploy/extract.php?step=extract&from=$next") || { echo "$out"; exit 1; }
            echo "$out"
            if echo "$out" | grep -q '"done":true'; then break; fi
            next=$(echo "$out" | sed -n 's/.*"next":\([0-9]*\).*/\1/p')
            [ -n "$next" ] || { echo "::error::Unexpected extractor response"; exit 1; }
          done
          echo "$out" | grep -q '"done":true' || { echo "::error::Extraction did not finish"; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 120 -X POST \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            "$SITE_URL/_deploy/extract.php?step=finish"
          echo

      # Database migrations, first-time content and cache clearing
      - name: Run post-deploy tasks
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        # On failure the route returns only a stage and a safe code, so it can
        # go into the run's annotation without leaking anything
        run: |
          out=$(curl --fail-with-body --silent --show-error --max-time 600 -X POST \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            "$SITE_URL/_tegora/post-deploy") || {
            echo "::error::Post-deploy failed: $(echo "$out" | tr -cd 'a-zA-Z0-9_:,{}" ' | cut -c1-200)"
            exit 1
          }
          echo "$out"
