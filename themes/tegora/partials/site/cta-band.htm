{# Dark call-to-action band. Pass: title, text; optional secondary_label. #}
<section class="section section--dark" aria-label="{{ 'Pasul următor'|_ }}">
    <div class="wrap cta-band__inner">
        <div class="cta-band__text">
            <h2 class="h2">{{ title }}</h2>
            <p class="lead">{{ text }}</p>
        </div>
        <div class="btn-row">
            <a class="btn btn--light" href="{{ 'configurator'|page }}">{{ 'Configurează ușa'|_ }} {% partial 'ui/arrow' %}</a>
            <a class="btn btn--ghost" href="{{ 'contact'|page }}">{{ secondary_label|default('Discută cu un consultant'|_) }}</a>
        </div>
    </div>
</section>
