<div class="cfg-step__head">
    <span class="cfg-step__num" aria-hidden="true">{{ n }}</span>
    <h2 id="s{{ n }}" class="cfg-step__title">{{ title }}{% if sub %} <span class="cfg-step__sub">{{ sub }}</span>{% endif %}</h2>
    {% if tip %}<span class="cfg-tip"><button class="cfg-tip__btn" type="button" aria-label="{{ 'Informații'|_ }}" aria-describedby="tip-s{{ n }}" aria-expanded="false">i</button><span class="cfg-tip__bubble" role="tooltip" id="tip-s{{ n }}">{{ tip }}</span></span>{% endif %}
</div>
