uuid: 7d3f1c52-6a10-4f7e-9c11-0a1b2c3d4e02
handle: Leads\Request
type: submission
name: Cereri de ofertă

submission:
    titleTemplate: '{{ nume }}{% if localitate %}, {{ localitate }}{% endif %}'

navigation:
    label: Cereri de ofertă
    icon: ph ph-envelope-simple
    order: 100

fields:
    sursa:
        label: Formular
        type: dropdown
        validation: required|in:contact,configurator
        options:
            contact: Contact
            configurator: Configurator
    nume:
        label: Nume
        type: text
        validation: required|min:2|max:120
    telefon:
        label: Telefon
        type: text
        validation: required|min:6|max:40
    email:
        label: Email
        type: email
        validation: nullable|email|max:160
    localitate:
        label: Localitate
        type: text
        validation: nullable|max:120
    subiect:
        label: Subiect
        type: dropdown
        validation: nullable|in:oferta,tehnic,showroom,altele
        options:
            oferta: Solicitare ofertă
            tehnic: Consultanță tehnică
            showroom: Programare în showroom
            altele: Altceva
    tip:
        label: Tip proiect
        type: dropdown
        validation: nullable|in:casa,ansamblu,comercial
        options:
            casa: Casă individuală
            ansamblu: Ansamblu rezidențial
            comercial: Comercial
    sistem:
        label: Sistem de interes
        type: dropdown
        validation: nullable|in:nestiut,performante,pasive,acustice,foc
        options:
            nestiut: Nu știu încă, vreau o recomandare
            performante: Uși performante (FERRO KlassikPlus / Klima)
            pasive: Uși pentru case pasive (FERRO Passiv)
            acustice: Uși acustice (FERRO Akustik)
            foc: Uși rezistente la foc (FERRO FireSafe)
    configuratie:
        label: Configurație
        type: text
        validation: nullable|max:80
    dimensiuni:
        label: Dimensiuni
        type: text
        validation: nullable|max:80
    termen:
        label: Când e nevoie de ușă
        type: dropdown
        validation: nullable|in:informare,1-3,3-6,6+
        options:
            informare: Doar se informează
            1-3: În 1–3 luni
            3-6: În 3–6 luni
            6+: Peste 6 luni
    detalii_configurator:
        label: Selecții din configurator
        type: textarea
        validation: nullable|max:4000
    mesaj:
        label: Mesaj
        type: textarea
        validation: nullable|max:4000
    gdpr:
        label: Acord prelucrare date
        type: checkbox
        validation: accepted
